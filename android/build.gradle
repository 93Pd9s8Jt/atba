allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// `rootProject.buildDir` / `project.buildDir` are deprecated in Gradle 8 and slated for
// removal in Gradle 9, so the build directories are relocated via the layout API instead.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)
subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
ext {
    compileSdkVersion = 33
    targetSdkVersion = 33
    minSdkVersion = 21
}

